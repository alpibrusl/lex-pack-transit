[package]
name        = "lex-pack-transit"
version     = "0.1.0"
description = "Scheduled-service (transit) domain pack — GTFS-style frequency-based trips, timetable expansion, and GTFS-RT-style adherence. No custody chain or settlement trail — a trip's evidence is a position update assessed against the timetable."

[dependencies]
lex-soft   = { git = "https://github.com/alpibrusl/lex-soft" }
lex-web    = { git = "https://github.com/alpibrusl/lex-web" }
lex-schema = { git = "https://github.com/alpibrusl/lex-schema" }
